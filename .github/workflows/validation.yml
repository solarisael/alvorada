name: Validation Baseline

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Verify staged Obsidian content
        run: bun run content:check

      - name: Bun tests
        run: bun test

      - name: Build Astro site
        run: bun run build

      - name: Prettier check
        run: bunx prettier --check .
